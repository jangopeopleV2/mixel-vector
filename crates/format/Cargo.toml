[package]
name = "vectorcraft-format"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MIXEL Vector native .vectorcraft format (versioned JSON, embedded images)"

[lints]
workspace = true

[features]
mac-app-store = ["dep:objc2-foundation"]

[dependencies]
vectorcraft-doc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
flate2 = { workspace = true }

[dev-dependencies]
vectorcraft-testkit = { workspace = true }
proptest = { workspace = true }
vectorcraft-geom = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3", optional = true, default-features = false, features = ["std", "NSFileManager", "NSPathUtilities", "NSString", "NSURL", "NSError", "NSDictionary"] }
